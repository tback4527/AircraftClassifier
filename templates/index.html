<!DOCTYPE html>
<html>
    <head>
        <title>Aircraft Imagery Classification</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
    </head>
    <body>
        <h1 class="text-center">Aircraft Classifier</h1>
        <h2 class="text-center">Image Predictor</h2>
        <p class="text-left">Select Satellite Imagery</p>
        <form class="p-3 text-center" action="/", method="post" enctype="multipart/form-data">
            <input class="form-control" type="file" name="imagefile">
            <input class="btn btn-primary mt-3" type="submit" value="Predict Image">
        </form>

            <img src="{{ url_for('static', filename='images/' + image_path) }}" alt="image"
            style="display: block; margin-left: Auto; margin-right: Auto; width: 300px; height:Auto;">
            <p class="text-center">
                Image Label: {{label}} || Prediction result: {{imagePred}}
            </p>
        
        <h2 class="text-center">Model Results</h2>
        <img src="{{url_for('static', filename='images/cm.png') }}" alt="CM"
        style="display: block; margin-left: Auto; margin-right: Auto; width: 600px; height: Auto;">
        <img src="{{url_for('static', filename='images/acc.png') }}" alt="Acc"
        style="display: block; margin-left: Auto; margin-right: Auto; width: 600px; height: Auto;">
        <img src="{{url_for('static', filename='images/loss.png') }}" alt="Loss"
        style="display: block; margin-left: Auto; margin-right: Auto; width: 600px; height: Auto;">

    </body>
</html>
